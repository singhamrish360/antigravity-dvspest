services:
  - type: web
    name: virtual-twin-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: FISH_VOICE_ID
        sync: false
